services:
  - type: web
    name: inventory-backend
    env: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: PORT
        value: 8000

databases:
  - name: inventory-db
    plan: free

